<title>Gallery - Tiffin Tale</title>

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                    url('vegetables.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: white;
}

/* HEADER */
header {
  background: linear-gradient(90deg, #ff6f61, #ffcc00);
  padding: 1.5rem 2rem;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 2rem;
}

nav {
  margin-top: 10px;
}

nav a {
  color: white;
  margin: 0 15px;
  text-decoration: none;
  font-weight: 600;
}

nav a:hover {
  opacity: 0.8;
}

/* SECTION */
.gallery-section {
  padding: 4rem 2rem;
  text-align: center;
}

.gallery-section h2 {
  font-size: 2.5rem;
  margin-bottom: 3rem;
}

/* GALLERY GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  max-width: 1300px;
  margin: auto;
}

.gallery img {
  width: 100%;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  transition: 0.4s ease;
}

.gallery img:hover {
  transform: scale(1.05);
}

/* FOOTER */
footer {
  background: rgba(0,0,0,0.8);
  text-align: center;
  padding: 1.5rem;
  margin-top: 4rem;
}

</style>
