<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images - Tiffin Tale</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    header { background: linear-gradient(90deg, #ff6f61, #ffcc00); color: white; padding: 2rem; text-align: center; }
    header h1 { font-size: 2.5rem; }
    nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 1rem; padding: 2rem; }
    .gallery img { width: 100%; border-radius: 8px; opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .gallery img.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 768px) {
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Image Gallery</h1>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <div class="gallery">
    <img src="gallery1.jpg" alt="Tiffin Image 1">
    <img src="gallery2.jpg" alt="Tiffin Image 2">
    <img src="gallery3.jpg" alt="Tiffin Image 3">
    <img src="gallery4.jpg" alt="Tiffin Image 4">
    <img src="gallery5.jpg" alt="Tiffin Image 5">
    <img src="gallery6.jpg" alt="Tiffin Image 6">
    <img src="gallery7.jpg" alt="Tiffin Image 7">
    <img src="gallery8.jpg" alt="Tiffin Image 8">
    <img src="gallery9.jpg" alt="Tiffin Image 9">
    <img src="gallery10.jpg" alt="Tiffin Image 10">
    <img src="gallery11.jpg" alt="Tiffin Image 11">
    <img src="gallery12.jpg" alt="Tiffin Image 12">
    <img src="gallery13.jpg" alt="Tiffin Image 13">
    <img src="gallery14.jpg" alt="Tiffin Image 14">
    <img src="gallery15.jpg" alt="Tiffin Image 15">
    <img src="gallery16.jpg" alt="Tiffin Image 16">
    <img src="gallery17.jpg" alt="Tiffin Image 17">
    <img src="gallery18.jpg" alt="Tiffin Image 18">
    <img src="gallery19.jpg" alt="Tiffin Image 19">
    <img src="gallery20.jpg" alt="Tiffin Image 20">
    <img src="gallery21.jpg" alt="Tiffin Image 21">
    <img src="gallery22.jpg" alt="Tiffin Image 22">
    <img src="gallery23.jpg" alt="Tiffin Image 23">
    <img src="gallery24.jpg" alt="Tiffin Image 24">
    <!-- Add more images as needed -->
  </div>

  <script>
    function revealImages() {
      const imgs = document.querySelectorAll('.gallery img');
      imgs.forEach(img => {
        const rect = img.getBoundingClientRect();
        if (rect.top < window.innerHeight - 50) {
          img.classList.add('visible');
        }
      });
    }
    window.addEventListener('scroll', revealImages);
    window.addEventListener('load', revealImages);
  </script>
</body>
</html>
