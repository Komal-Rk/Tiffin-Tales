<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Reviews - Tiffin Tales</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background-image:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('vegetables.jpg');
background-size:cover;
background-position:center;
color:white;
}

header{
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:600;
}

nav a:hover{
color:#ffcc00;
}

.review-section{
max-width:650px;
margin:50px auto;
background:white;
color:black;
padding:30px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
}

.review-section h2{
text-align:center;
}

.average-rating{
text-align:center;
margin-bottom:20px;
}

.average-rating .stars{
font-size:22px;
color:gold;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

button{
width:100%;
padding:12px;
background:#ff6f61;
color:white;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffcc00;
color:black;
}

.star-select{
display:flex;
justify-content:center;
margin-bottom:15px;
}

.star{
font-size:30px;
cursor:pointer;
color:gray;
}

.star.active{
color:gold;
}

.review-card{
background:#f8f8f8;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.rating-display{
color:gold;
font-size:18px;
}

footer{
text-align:center;
padding:20px;
}

  /* =========================
   RESPONSIVE HEADER FIX
========================= */

header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
padding:15px 25px;
box-sizing:border-box;
}

nav{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

nav a{
font-size:16px;
display:flex;
align-items:center;
gap:6px;
}

/* =========================
   MOBILE SCREEN FIX
========================= */

@media (max-width:768px){

header{
flex-direction:column;
align-items:center;
text-align:center;
padding:15px;
}

header h1{
font-size:1.6rem;
margin-bottom:10px;
}

nav{
width:100%;
justify-content:space-around;
gap:10px;
}

nav a{
font-size:14px;
}

.hero h2{
font-size:2rem;
}

.hero p{
font-size:14px;
}

.container{
padding:20px;
}

.menu-grid{
grid-template-columns:1fr;
}

.review-section{
margin:20px;
}

}

/* =========================
   SMALL PHONE FIX
========================= */

@media (max-width:480px){

header h1{
font-size:1.4rem;
}

nav a{
font-size:13px;
}

.hero h2{
font-size:1.7rem;
}

}

</style>
</head>

<body>

<header>
<h1>Tiffin Tales</h1>

<nav>
<a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
<a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
</nav>

</header>

<div class="review-section">

<h2>Customer Reviews</h2>

<div class="average-rating">
<div id="averageStars" class="stars">☆☆☆☆☆</div>
<div id="averageText">0.0 out of 5 (0 reviews)</div>
</div>

<hr>

<h2>Write a Review</h2>

<input type="text" id="name" placeholder="Your Name">

<input type="email" id="email" placeholder="Your Gmail (example@gmail.com)">

<div class="star-select">
<span class="star" onclick="setRating(1)">★</span>
<span class="star" onclick="setRating(2)">★</span>
<span class="star" onclick="setRating(3)">★</span>
<span class="star" onclick="setRating(4)">★</span>
<span class="star" onclick="setRating(5)">★</span>
</div>

<textarea id="reviewText" rows="4" placeholder="Write your review here..."></textarea>

<button onclick="addReview()">Submit Review</button>

<div class="review-list" id="reviewList"></div>

</div>

<footer>
© 2026 Tiffin Tales | Designed by Komal
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyChqK-C3ZYeB0geUckK2qS0oF4-6kltdFk",
authDomain: "tiffin-tales-reviews-dae0a.firebaseapp.com",
projectId: "tiffin-tales-reviews-dae0a",
storageBucket: "tiffin-tales-reviews-dae0a.firebasestorage.app",
messagingSenderId: "357229019917",
appId: "1:357229019917:web:69375bf43a07fb3d49e644"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedRating = 0;

window.setRating = function(rating){

selectedRating = rating;

const stars=document.querySelectorAll(".star");

stars.forEach((star,index)=>{
star.classList.toggle("active", index < rating);
});

}

window.addReview = async function(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const reviewText=document.getElementById("reviewText").value.trim();

if(!name || !email || !reviewText || selectedRating===0){
alert("Please fill all fields and select rating");
return;
}

await addDoc(collection(db,"reviews"),{
name:name,
email:email,
reviewText:reviewText,
rating:selectedRating,
time:new Date()
});

displayReviews();
resetForm();

}

function resetForm(){

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("reviewText").value="";

selectedRating=0;

document.querySelectorAll(".star").forEach(star=>{
star.classList.remove("active");
});

}

async function displayReviews(){

const reviewList=document.getElementById("reviewList");
reviewList.innerHTML="";

const q=query(collection(db,"reviews"),orderBy("time","desc"));

const querySnapshot=await getDocs(q);

let totalRating=0;
let count=0;

querySnapshot.forEach((doc)=>{

const review=doc.data();

totalRating+=review.rating;
count++;

let stars="★".repeat(review.rating)+"☆".repeat(5-review.rating);

reviewList.innerHTML+=`
<div class="review-card">
<strong>${review.name}</strong><br>
<small>${review.email}</small>
<div class="rating-display">${stars}</div>
<p>${review.reviewText}</p>
</div>
`;

});

updateAverageRating(totalRating,count);

}

function updateAverageRating(total,count){

const avgStars=document.getElementById("averageStars");
const avgText=document.getElementById("averageText");

if(count===0){
avgStars.innerHTML="☆☆☆☆☆";
avgText.innerHTML="0.0 out of 5 (0 reviews)";
return;
}

let avg=(total/count).toFixed(1);
let stars=Math.round(avg);

avgStars.innerHTML="★".repeat(stars)+"☆".repeat(5-stars);
avgText.innerHTML=avg+" out of 5 ("+count+" reviews)";

}

displayReviews();

</script>

</body>
</html>
