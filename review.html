<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Reviews - Tiffin Tale</title>

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                    url('vegetables.jpg');
  background-size: cover;
  background-position: center;
  color: white;
}

/* HEADER */
header {
  padding: 20px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
  font-weight: 600;
}

nav a:hover {
  color: #ffcc00;
}

/* REVIEW SECTION */
.review-section {
  max-width: 600px;
  margin: 50px auto;
  background: white;
  color: black;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}

.review-section h2 {
  text-align: center;
  margin-bottom: 10px;
}

/* AVERAGE RATING */
.average-rating {
  text-align: center;
  margin-bottom: 20px;
}

.average-rating .stars {
  font-size: 22px;
  color: gold;
}

/* FORM INPUTS */
input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 12px;
  background: #ff6f61;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ffcc00;
  color: black;
}

/* STAR SELECTOR */
.star-select {
  display: flex;
  justify-content: center;
  margin-bottom: 15px;
}

.star {
  font-size: 30px;
  cursor: pointer;
  color: gray;
  transition: 0.3s;
}

.star.active {
  color: gold;
}

/* REVIEW LIST */
.review-list {
  margin-top: 30px;
}

.review-card {
  background: #f8f8f8;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.review-card strong {
  color: #ff6f61;
}

.rating-display {
  color: gold;
  font-size: 18px;
}

footer {
  text-align: center;
  padding: 20px;
}

</style>
</head>

<body>

<header>
  <h1>Tiffin Tale</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="images.html">Images</a>
    <a href="review.html">Review</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="review-section">
  <h2>Customer Reviews</h2>

  <!-- Average Rating Display -->
  <div class="average-rating">
    <div id="averageStars" class="stars">☆☆☆☆☆</div>
    <div id="averageText">0.0 out of 5 (0 reviews)</div>
  </div>

  <hr>

  <h2>Write a Review</h2>

  <input type="text" id="name" placeholder="Your Name">
  <input type="email" id="email" placeholder="Your Gmail (example@gmail.com)">

  <!-- Star Rating Selection -->
  <div class="star-select">
    <span class="star" onclick="setRating(1)">★</span>
    <span class="star" onclick="setRating(2)">★</span>
    <span class="star" onclick="setRating(3)">★</span>
    <span class="star" onclick="setRating(4)">★</span>
    <span class="star" onclick="setRating(5)">★</span>
  </div>

  <textarea id="reviewText" rows="4" placeholder="Write your review here..."></textarea>

  <button onclick="addReview()">Submit Review</button>

  <div class="review-list" id="reviewList"></div>
</div>

<footer>
  © 2026 Tiffin Tale | Designed by Komal
</footer>

<script>

let selectedRating = 0;

function setRating(rating) {
  selectedRating = rating;
  const stars = document.querySelectorAll(".star");
  stars.forEach((star, index) => {
    star.classList.toggle("active", index < rating);
  });
}

function addReview() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const reviewText = document.getElementById("reviewText").value.trim();

  if (!name || !email || !reviewText || selectedRating === 0) {
    alert("Please fill all fields and select rating.");
    return;
  }

  if (!email.endsWith("@gmail.com")) {
    alert("Please enter a valid Gmail address.");
    return;
  }

  const review = { name, email, reviewText, rating: selectedRating };
  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
  reviews.push(review);
  localStorage.setItem("reviews", JSON.stringify(reviews));

  displayReviews();
  resetForm();
}

function resetForm() {
  document.getElementById("name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("reviewText").value = "";
  selectedRating = 0;
  document.querySelectorAll(".star").forEach(star => star.classList.remove("active"));
}

function displayReviews() {
  const reviewList = document.getElementById("reviewList");
  reviewList.innerHTML = "";

  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

  let totalRating = 0;

  reviews.forEach(review => {
    totalRating += review.rating;

    let stars = "★".repeat(review.rating) + "☆".repeat(5 - review.rating);

    reviewList.innerHTML += `
      <div class="review-card">
        <strong>${review.name}</strong><br>
        <small>${review.email}</small>
        <div class="rating-display">${stars}</div>
        <p>${review.reviewText}</p>
      </div>
    `;
  });

  updateAverageRating(reviews, totalRating);
}

function updateAverageRating(reviews, totalRating) {
  const averageStars = document.getElementById("averageStars");
  const averageText = document.getElementById("averageText");

  if (reviews.length === 0) {
    averageStars.innerHTML = "☆☆☆☆☆";
    averageText.innerHTML = "0.0 out of 5 (0 reviews)";
    return;
  }

  let average = (totalRating / reviews.length).toFixed(1);
  let fullStars = Math.round(average);
  let starsDisplay = "★".repeat(fullStars) + "☆".repeat(5 - fullStars);

  averageStars.innerHTML = starsDisplay;
  averageText.innerHTML = `${average} out of 5 (${reviews.length} reviews)`;
}

displayReviews();

</script>

</body>
</html>
