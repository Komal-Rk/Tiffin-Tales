<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                    url('vegetables.jpg');
  background-size: cover;
  background-position: center;
  color: white;
}

header {
  background: linear-gradient(90deg, #ff6f61, #ffcc00);
  padding: 2rem;
  text-align: center;
}

nav a {
  color: white;
  margin: 0 15px;
  text-decoration: none;
  font-weight: bold;
}

nav i {
  margin-right: 6px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 3rem 2rem;
  text-align: center;
}

.contact-box {
  background: white;
  color: black;
  padding: 2rem;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

footer {
  text-align: center;
  padding: 1.5rem;
  background: rgba(0,0,0,0.8);
  margin-top: 3rem;
}

  /* =========================
   RESPONSIVE HEADER FIX
========================= */

header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
padding:15px 25px;
box-sizing:border-box;
}

nav{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

nav a{
font-size:16px;
display:flex;
align-items:center;
gap:6px;
}

/* =========================
   MOBILE SCREEN FIX
========================= */

@media (max-width:768px){

header{

align-items:center;
text-align:center;
padding:15px;
}

header h1{
font-size:1.6rem;
margin-bottom:10px;
}

nav{
width:100%;
justify-content:space-around;
gap:10px;
}

nav a{
font-size:14px;
}

.hero h2{
font-size:2rem;
}

.hero p{
font-size:14px;
}

.container{
padding:20px;
}

.menu-grid{
grid-template-columns:1fr;
}

.review-section{
margin:20px;
}

}

/* =========================
   SMALL PHONE FIX
========================= */

@media (max-width:480px){

header h1{
font-size:1.4rem;
}

nav a{
font-size:13px;
}

.hero h2{
font-size:1.7rem;
}

}
</style>
